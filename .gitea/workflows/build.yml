name: Build
run-name: ${{ gitea.actor }} build 🚀

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21.0.7'

      - name: Setup Android SDK
        uses: amyu/setup-android@v5
        with:
          cache-disabled: true

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Download AAR manually
        run: |
          FILE="app/libs/firefly-go.aar"
          URL="https://git.kain.io.vn/Firefly-Shelter/FireflyGo_Android/media/branch/master/app/libs/firefly-go.aar"
          echo "📥 Downloading $FILE from $URL"
          curl -L -o "$FILE" "$URL"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: KeyStore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$KEYSTORE_PATH -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
